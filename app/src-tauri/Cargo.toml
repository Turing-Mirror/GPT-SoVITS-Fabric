[package]
name = "gpt-sovits-fabric"
version = "1.0.0"
description = "RVC Fabric desktop shell (Tauri + React)"
authors = ["Turing Mirror"]
edition = "2021"
# Extra [[bin]] (catalog-check) requires an explicit default for tauri build.
default-run = "gpt-sovits-fabric"

[lib]
name = "app_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
trm-app-protocol = { git = "https://github.com/Turing-Mirror/trm-app-protocol.git", rev = "f02269b436215a04980b0b450edf7764a5d79493", features = ["codegen"] }
tauri-build = { version = "2", features = [] }

[[bin]]
name = "gpt-sovits-fabric"
path = "src/main.rs"

[[bin]]
name = "catalog-check"
path = "src/bin/catalog-check.rs"

[dependencies]
trm-app-protocol = { git = "https://github.com/Turing-Mirror/trm-app-protocol.git", rev = "f02269b436215a04980b0b450edf7764a5d79493" }
tauri = { version = "2", features = ["protocol-asset", "tray-icon", "image-png"] }
tauri-plugin-opener = "2"
tauri-plugin-global-shortcut = "2"
tauri-plugin-updater = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
# Multi-part HTTP range downloader (https://github.com/sam0x17/ripget) — aria2-style
ripget = "0.3"
tokio = { version = "1", features = ["rt-multi-thread", "time", "macros", "sync", "net", "io-util"] }
# Catalog JSON fetch (lightweight)
reqwest = { version = "0.12", default-features = false, features = ["blocking", "rustls-tls"] }
openidconnect = { version = "=4.1.0", features = ["timing-resistant-secret-traits"] }
keyring = { version = "=4.2.0", features = ["v1"] }
url = "2"
sha2 = "0.10"
hex = "0.4"
tar = "0.4"
flate2 = "1"
zip = { version = "2", default-features = false, features = ["deflate"] }
rfd = "0.15"
trash = "=5.2.6"
regex = "1"
# Local-time stamps for diagnostics / consult filenames (support reads these)
chrono = { version = "0.4", default-features = false, features = ["clock", "std"] }
tauri-plugin-single-instance = "2"

# Process liveness without spawning a helper process. The status poll runs
# every 400 ms while converting; shelling out to tasklist / powershell there
# was costing more CPU than the conversion itself.
[target.'cfg(windows)'.dependencies]
windows-sys = { version = "0.59", features = [
  "Win32_Foundation",
  "Win32_System_Threading",
  "Win32_System_Registry",
  # RegCreateKeyExW 引用 SECURITY_ATTRIBUTES（Win32_Security），
  # 开机自启（autostart.rs）需要它创建 Run 键。
  "Win32_Security",
  # 无边框窗口的圆角靠 DWM 属性，不靠透明窗口 + CSS 圆角 —— 后者会连系统
  # 投影一起丢掉，四角还会露出锯齿。
  "Win32_Graphics_Dwm",
  # 显示器与工作区（MonitorFromWindow / GetMonitorInfoW）归在 Gdi 下。
  "Win32_Graphics_Gdi",
  # Win10 要回系统投影：DwmExtendFrameIntoClientArea 的 MARGINS 在 Controls 下。
  "Win32_UI_Controls",
  # 无边框窗口的样式与最大化矩形：GetWindowLong / SetWindowPos / MINMAXINFO。
  "Win32_UI_WindowsAndMessaging",
  # 无边框最大化：子类化 WM_GETMINMAXINFO / WM_WINDOWPOSCHANGING，
  # 落地前把矩形钳到工作区（不含任务栏），避免事后 SetWindowPos 毁掉还原尺寸。
  "Win32_UI_Shell",
  # 退出/关变声时枚举 Runtime 下残留的 python*.exe（含 AudioIoProcess 孤儿）。
  "Win32_System_Diagnostics_ToolHelp",
  # 诊断自检要看产品所在盘还剩多少（GetDiskFreeSpaceExW）。
  "Win32_Storage_FileSystem",
] }

[[bin]]
name = "gpt-sovits-fabric-mcp"
path = "src/bin/mcp.rs"
