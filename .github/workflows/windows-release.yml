name: Windows release

on:
  workflow_dispatch:
    inputs:
      release_draft:
        description: Sign the installer and prepare a draft release
        type: boolean
        default: false

permissions:
  contents: read

env:
  PYTHONUTF8: "1"
  # npm's locked Git dependencies are public and can be fetched over HTTPS.
  GIT_CONFIG_COUNT: "1"
  GIT_CONFIG_KEY_0: url.https://github.com/.insteadOf
  GIT_CONFIG_VALUE_0: ssh://git@github.com/

jobs:
  build:
    name: Build Windows x64
    runs-on: windows-2025
    timeout-minutes: 35
    outputs:
      version: ${{ steps.package.outputs.version }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: "24"
          cache: npm
          cache-dependency-path: app/package-lock.json
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: "3.13"
      - name: Select the Windows Rust toolchain
        run: rustup default stable-x86_64-pc-windows-msvc
      - name: Install frontend dependencies
        working-directory: app
        run: npm ci --no-audit --no-fund
      - name: Test the frontend
        working-directory: app
        run: npm test
      - name: Build the installer
        id: package
        run: |
          $version = python scripts/shell_version.py
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          python scripts/build_setup.py --unsigned --skip-frontend
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          "version=$version" >> $env:GITHUB_OUTPUT
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: windows-x64-candidate
          path: |
            dist/GPT-SoVITS-Fabric-Setup-${{ steps.package.outputs.version }}.exe
            dist/GPT-SoVITS-Fabric-Setup-${{ steps.package.outputs.version }}.exe.sha256
          if-no-files-found: error

  draft:
    name: Sign and prepare draft
    if: inputs.release_draft && github.ref_type == 'branch' && github.ref_name == github.event.repository.default_branch
    needs: build
    runs-on: windows-2025
    timeout-minutes: 10
    environment: release
    permissions:
      contents: write
    env:
      RELEASE_VERSION: ${{ needs.build.outputs.version }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: "24"
          cache: npm
          cache-dependency-path: app/package-lock.json
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: windows-x64-candidate
          path: dist
      - name: Install the locked Tauri CLI
        working-directory: app
        run: npm ci --no-audit --no-fund
      - name: Sign and verify the installer
        env:
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
        run: |
          if (!$env:TAURI_SIGNING_PRIVATE_KEY -or !$env:TAURI_SIGNING_PRIVATE_KEY_PASSWORD) {
            throw "Set both Tauri signing secrets in the release environment."
          }
          $installer = (Resolve-Path "dist/GPT-SoVITS-Fabric-Setup-$env:RELEASE_VERSION.exe").Path
          npm --prefix app run tauri -- signer sign $installer
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          node scripts/verify_setup_signature.mjs $installer app/src-tauri/tauri.conf.json
      - name: Create the GitHub draft
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          $tag = "v$env:RELEASE_VERSION"
          $installer = "dist/GPT-SoVITS-Fabric-Setup-$env:RELEASE_VERSION.exe"
          $existingRefs = git ls-remote --tags origin "refs/tags/$tag" "refs/tags/$tag^{}"
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          if ($existingRefs -and $env:GITHUB_SHA -notin ($existingRefs | ForEach-Object { ($_ -split '\s+')[0] })) {
            throw "Tag $tag points at a different commit."
          }
          gh release create $tag --target $env:GITHUB_SHA --draft --title "GPT-SoVITS Fabric $tag" --notes "Windows x64 installer." $installer "$installer.sig" "$installer.sha256"
